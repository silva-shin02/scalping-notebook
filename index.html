<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Scalping NB"/>
<meta name="theme-color" content="#1a1a1a"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-180.png"/>
<title>Scalping Notebook</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100vh;overscroll-behavior-x:none}
body{padding:8px;padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right));padding-bottom:max(8px,env(safe-area-inset-bottom));font-family:-apple-system,'Helvetica Neue',sans-serif;background:#fafaf8;color:#1a1a1a;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
/* テキスト入力欄では選択・コピペ・長押しメニューを維持 */
input,textarea,[contenteditable="true"],[contenteditable=""]{-webkit-touch-callout:default;-webkit-user-select:text;user-select:text}
button,input,select,textarea{font-family:inherit}
#root{width:100%;margin:0 auto}
@media(max-width:480px){.cal-cell{min-height:48px!important;padding:3px 4px!important}.cal-date{font-size:12px!important}body{padding:4px;padding-bottom:max(4px,env(safe-area-inset-bottom))}}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:#ccc;border-radius:2px}
.news-hscroll::-webkit-scrollbar{height:14px}
.news-hscroll::-webkit-scrollbar-track{background:#f0efeb;border-radius:7px}
.news-hscroll::-webkit-scrollbar-thumb{background:#b8b5ac;border-radius:7px;border:2px solid #f0efeb}
.news-hscroll::-webkit-scrollbar-thumb:hover{background:#8a877d}
/* 日足チャート 横スクロールバー (太め) */
.dc-chart-wrap::-webkit-scrollbar{height:20px}
.dc-chart-wrap::-webkit-scrollbar-track{background:#0d0d0d;border-radius:4px}
.dc-chart-wrap::-webkit-scrollbar-thumb{background:#4a4a4a;border-radius:4px;border:3px solid #0d0d0d}
.dc-chart-wrap::-webkit-scrollbar-thumb:hover{background:#6a6a6a}
.news-hscroll{scrollbar-width:auto;scrollbar-color:#b8b5ac #f0efeb}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
canvas{image-rendering:high-quality;-webkit-image-rendering:high-quality}
@keyframes spin{to{transform:rotate(360deg)}}
/* メモ編集欄: 選択ハイライトを半透明にして文字色が透けて見えるようにする */
/* text-decoration-color:inherit で、選択中も各spanの下線色(緑等)を維持(既定だと文字色で描かれる) */
.sn-rme-editable::selection,.sn-rme-editable *::selection{background:rgba(100,150,255,0.30);-webkit-text-decoration-color:inherit;text-decoration-color:inherit}
.sn-rme-editable::-moz-selection,.sn-rme-editable *::-moz-selection{background:rgba(100,150,255,0.30);text-decoration-color:inherit}
/* ダークモード: 画面全体を「スマート反転」（明度だけ反転・色相は保持＝損益の赤/緑等の意味色は維持）。
   画像・canvas（チャート）は逆フィルタで打ち消して元の見た目を復元＝劣化なし。
   SVGの折れ線/円グラフ等は反転のままにして暗背景で明るい線にする。 */
html.sn-dark{filter:invert(1) hue-rotate(180deg);background:#fff}
html.sn-dark img,html.sn-dark canvas,html.sn-dark video,html.sn-dark [data-sn-noinvert]{filter:invert(1) hue-rotate(180deg)}
</style>
<script>
/* ダークモード初期適用: body 描画前に html へ sn-dark を付与してチラつきを防ぐ。
   「自動」はOSの配色設定に追従（システム変更時もライブで切替）。 */
(function(){try{
  var KEY='sn_theme_v1';
  function isDark(){ var m; try{ m=localStorage.getItem(KEY); }catch(e){ m=null; }
    return m==='dark' || (m==='auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); }
  function apply(){ try{ document.documentElement.classList.toggle('sn-dark', isDark()); }catch(e){} }
  apply();
  if(window.matchMedia){ var mq=window.matchMedia('(prefers-color-scheme: dark)');
    try{ mq.addEventListener('change', apply); }catch(e){ try{ mq.addListener(apply); }catch(e2){} } }
}catch(e){}})();
</script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
</head>
<body>
<div id="root"><div style="display:flex;align-items:center;justify-content:center;height:80vh;font-size:15px;color:#888">読み込み中...</div></div>
<script>
// Service Worker 登録＋自動更新（2026-07-13）: Firebase Storage 画像キャッシュに加え、
// 新バージョン(sw.js変更でAPP_CACHE名が変わる)を検知したら install→skipWaiting→activate で controllerchange が発火。
// 既存SWからの更新時のみ、開いているページを1回だけ自動リロードして新しい app-*.js に差し替える。
// → iPad(ホーム画面PWA)の「修正が反映されない＝旧app-*.jsをSWが握ったまま」を解消（従来は手動で1〜2回開き直しが必要だった）。
if ("serviceWorker" in navigator) {
  var _snHadController = !!navigator.serviceWorker.controller;   // 読込時に既存SWが居たか＝更新か初回かの判定
  var _snRefreshing = false;                                     // 二重リロード防止
  navigator.serviceWorker.addEventListener("controllerchange", function() {
    if (_snRefreshing) return;
    _snRefreshing = true;
    if (_snHadController) window.location.reload();              // 初回インストール（コントローラ無し→有り）はリロードしない・既存SWからの更新だけ自動リロード
  });
  navigator.serviceWorker.register("sw.js").then(function(reg) {
    console.log("[SW] registered, scope:", reg.scope);
    try { reg.update(); } catch (e) {}                           // 起動時に更新チェックを能動的に走らせる（iOSは自動チェックが遅いため）
  })["catch"](function(e) {
    console.warn("[SW] registration failed:", e);
  });
}
</script>
<script src="vendor.js"></script>
<script src="app-01.js"></script>
<script src="app-02.js"></script>
<script src="app-03.js"></script>
<script src="app-04.js"></script>
<script src="app-05.js"></script>
<script src="app-06.js"></script>
<script src="app-07.js"></script>
<script src="app-08.js"></script>
</body>
</html>
